<!DOCTYPE html>
<html>
<head>
    <title>Booking Confirmed</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .card {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #0f766e;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 22px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Appointment Booked Successfully</h1>
        <p>The patient confirmation message has been generated.</p>
        <a href="/book/">Book Another Appointment</a>
    </div>

</body>
</html>
