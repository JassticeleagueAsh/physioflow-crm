<!DOCTYPE html>
<html>
<head>
    <title>PhysioFlow CRM | Patients</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; }
        .header { background: #0f766e; color: white; padding: 28px 55px; }
        .container { max-width: 1100px; margin: 35px auto; padding: 0 25px; }
        .section { background: white; padding: 26px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.07); }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #0f766e; margin: 0; }
        .btn { background: #0f766e; color: white; padding: 11px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .secondary { background: #334155; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f1f5f9; padding: 13px; }
        td { padding: 13px; border-bottom: 1px solid #e5e7eb; }
        .link { color: #0f766e; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>PhysioFlow CRM</h1>
    <p>Patient Records</p>
</div>

<div class="container">
    <div class="section">
        <div class="topbar">
            <h2>Patients</h2>
            <div>
                <a href="/admin/clinic/patient/add/" class="btn">Add Patient</a>
                <a href="{% url 'dashboard' %}" class="btn secondary">Dashboard</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>File Number</th>
                    <th>Full Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Profile</th>
                </tr>
            </thead>
            <tbody>
                {% for patient in patients %}
                <tr>
                    <td>{{ patient.file_number }}</td>
                    <td>{{ patient.full_name }}</td>
                    <td>{{ patient.phone_number }}</td>
                    <td>{{ patient.email|default:"No email" }}</td>
                    <td>
                        <a href="{% url 'patient_profile' patient.id %}" class="link">
                            View Profile
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
